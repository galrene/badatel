services:
  badatel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badatel
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
    volumes:
      # Persist buildings and settings data across container restarts
      - ${DATA_PATH:-./data}:/app/data
      # Persist uploaded site plans and document photos
      - ${UPLOADS_PATH:-./public/uploads}:/app/public/uploads
