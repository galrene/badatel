<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#334155" stroke-width="4" />

  <!-- Blueprint Grid lines -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Map Building Polygon Footprint -->
  <polygon points="120,360 140,160 350,140 400,280 340,380" fill="url(#polyGrad)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Corner Vertex Handles -->
  <circle cx="120" cy="360" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
  <circle cx="140" cy="160" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
  <circle cx="350" cy="140" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
  <circle cx="400" cy="280" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4" />
  <circle cx="340" cy="380" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4" />

  <!-- Badge Marker Circle -->
  <circle cx="256" cy="256" r="68" fill="#2563eb" stroke="#ffffff" stroke-width="7" filter="url(#glow)" />

  <!-- Letter Badge Text 'B' -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">B</text>
</svg>